name: Release

# Build native installers for Windows, macOS (Intel + Apple Silicon), and Linux
# whenever a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# tauri-action needs write access to create the GitHub Release.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest # Intel
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # --- Windows code signing via Azure Trusted Signing (optional) ---
      # To enable:
      #   1. Set up Azure Trusted Signing and create repo secrets
      #      AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID
      #      (Settings > Secrets and variables > Actions).
      #   2. Uncomment this step and the AZURE_* env lines below.
      #   3. Add a "signCommand" to src-tauri/tauri.conf.json's bundle.windows
      #      block (see the "Code signing" section in the README).
      # - name: Install Windows signing tool
      #   if: matrix.platform == 'windows-latest'
      #   run: cargo install trusted-signing-cli

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows — Azure Trusted Signing credentials (see step above):
          # AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # macOS — Apple signing + notarization (see README "Code signing"):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PhaserGame ${{ github.ref_name }}'
          releaseBody: 'Download the installer — or the portable .exe (Windows) / AppImage (Linux) — for your platform from the assets below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Attach the raw compiled .exe as a portable, no-installer download.
      # (Linux AppImage and the macOS .app are already portable.) The portable
      # .exe runs standalone as long as the WebView2 runtime is present —
      # bundled with Windows 11, evergreen on most Windows 10.
      - name: Attach portable Windows executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release -Filter *.exe -File |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No portable .exe found in src-tauri/target/release" }
          $portable = Join-Path $exe.DirectoryName "$($exe.BaseName)_${{ github.ref_name }}_portable.exe"
          Copy-Item $exe.FullName $portable
          gh release upload "${{ github.ref_name }}" "$portable" --clobber
